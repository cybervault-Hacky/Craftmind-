# Project-wide Gradle properties for CraftMind.
#
# This file did not exist before. Its absence left `android.useAndroidX` at AGP's unset default (false), which
# AGP's dependency-metadata check (`:app:checkDebugAarMetadata`) treats as a hard conflict as soon as any AndroidX
# artifact appears on a configuration's classpath: "Configuration ':app:debugRuntimeClasspath' contains AndroidX
# dependencies, but the 'android.useAndroidX' property is not enabled." `app/build.gradle.kts` declares AndroidX
# Compose UI and Activity Compose dependencies (gradle/libs.versions.toml), so the property must be explicitly on.
#
# No legacy `com.android.support.*` artifact is declared anywhere in this repository (checked against
# gradle/libs.versions.toml and every build.gradle.kts), so `android.enableJetifier` is not needed and is left unset
# rather than added speculatively.
android.useAndroidX=true
