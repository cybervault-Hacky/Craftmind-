plugins {
    id 'fabric-loom' version '1.9.2'
}

version = '1.1.0'
group = 'com.craftmind.bridge'
base {
    archivesName = 'craftmind-bridge'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.2+1.20.1'
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.85.2'
    include 'org.bouncycastle:bcpkix-jdk18on:1.85.2'
    include 'org.bouncycastle:bcprov-jdk18on:1.85.2'
    include 'org.bouncycastle:bcutil-jdk18on:1.85.2'
    testImplementation 'junit:junit:4.13.2'
}

sourceSets.main.java.srcDir('../bridge-protocol/src/main/java')

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnit()
}
